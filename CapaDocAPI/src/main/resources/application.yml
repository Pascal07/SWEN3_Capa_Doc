spring:
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

storage:
  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    accessKey: ${RUSTFS_ACCESS_KEY:}
    secretKey: ${RUSTFS_SECRET_KEY:}
    bucket: ${RUSTFS_BUCKET:documents}
    region: ${RUSTFS_REGION:us-east-1}
    autoCreateBucket: ${RUSTFS_AUTO_CREATE_BUCKET:true}
    maxRetries: ${RUSTFS_INIT_MAX_RETRIES:10}
    retryDelayMs: ${RUSTFS_INIT_RETRY_DELAY_MS:2000}

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  indexName: ${ELASTICSEARCH_INDEX:documents}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
  autoCreateIndex: ${ELASTICSEARCH_AUTO_CREATE_INDEX:true}
  maxRetries: ${ELASTICSEARCH_INIT_MAX_RETRIES:10}
  retryDelayMs: ${ELASTICSEARCH_INIT_RETRY_DELAY_MS:2000}

---
spring:
  config:
    activate:
      on-profile: local

storage:
  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
    accessKey: ${RUSTFS_ACCESS_KEY:}
    secretKey: ${RUSTFS_SECRET_KEY:}
    bucket: ${RUSTFS_BUCKET:documents}
    region: ${RUSTFS_REGION:us-east-1}

---
spring:
  config:
    activate:
      on-profile: docker

storage:
  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
    accessKey: ${RUSTFS_ACCESS_KEY:}
    secretKey: ${RUSTFS_SECRET_KEY:}
    bucket: ${RUSTFS_BUCKET:documents}
    region: ${RUSTFS_REGION:us-east-1}

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
  indexName: ${ELASTICSEARCH_INDEX:documents}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
