spring.application.name=CapaDocAPI

# URL: Falls SPRING_DATASOURCE_URL nicht gesetzt ist, nimm localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:capadoc_db}}

# Zugangsdaten: Werden zur Laufzeit dynamisch aus den Variablen gelesen
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:capadoc_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
server.port=8081

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL:http://localhost}/api/login/oauth2/code/{registrationId}

server.forward-headers-strategy=framework
app.frontend-url=${APP_BASE_URL:http://localhost}

# ==========================================
# RABBITMQ CONNECTION
# ==========================================
# Nutzt die Umgebungsvariablen aus Docker/IDE oder fällt lokal auf Standardwerte zurück
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:capadoc}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:capadoc}

# Optional: Verhindert endlose Hänger beim Starten, falls RabbitMQ nicht erreichbar ist
spring.rabbitmq.connection-timeout=5000

# ==========================================
# RABBITMQ QUEUES & EXCHANGES (Custom)
# ==========================================
capadoc.rabbitmq.exchange=ocr.exchange
capadoc.rabbitmq.queue=ocr.queue
capadoc.rabbitmq.routingkey=ocr.routingkey

# Dead-Letter-Queue (DLQ) für fehlerhafte Nachrichten
capadoc.rabbitmq.dlx=ocr.dlx
capadoc.rabbitmq.dlq=ocr.dlq
capadoc.rabbitmq.dlq.routingkey=ocr.dlq.routingkey