spring.application.name=CapaDocAPI

# Fuer Controller-Tests wird keine echte Postgres-Datenbank benoetigt.
# Der volle Spring-Kontext (inkl. JPA-Repositories) faehrt gegen eine
# H2-In-Memory-Datenbank hoch, damit @SpringBootTest ohne laufenden
# Postgres-Server funktioniert.
spring.datasource.url=jdbc:h2:mem:capadoc_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

app.frontend-url=http://localhost
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Dummy-Werte für @Value Annotationen in RabbitMQConfig / Services während der Tests
capadoc.rabbitmq.exchange=test.exchange
capadoc.rabbitmq.queue.ocr=test.ocr.queue
capadoc.rabbitmq.queue.result=test.result.queue
capadoc.rabbitmq.routingkey.ocr=test.ocr.key
capadoc.rabbitmq.routingkey.result=test.result.key

# Verhindert, dass @RabbitListener während der Unit-Tests versucht, sich mit einem echten Broker zu verbinden
spring.rabbitmq.listener.simple.auto-startup=false