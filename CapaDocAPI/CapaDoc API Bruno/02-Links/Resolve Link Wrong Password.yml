info:
  name: Resolve Link Wrong Password
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/links/{{shortCode}}?password=wrongpassword"
  params:
    - name: password
      value: wrongpassword
      type: query

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8081
  scripts:
    - type: tests
      code: |-
        test("status is 401 Unauthorized", function () {
            expect(res.getStatus()).to.equal(401);
          });

          test("no document data is leaked on wrong password", function () {
            const body = res.getBody();
            if (body) {
              expect(body.filename).to.not.exist;
            }
          });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
