info:
  name: Ping
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/ping"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8081

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
