info:
  name: Update Document
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/documents/{{documentId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "filename": "HelloWorld-renamed.pdf",
        "contentType": "application/pdf",
        "sizeBytes": 10240
      }

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
  scripts:
    - type: tests
      code: |-
        test("status is 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("response contains id", function () {
          const body = res.getBody();
          expect(body).to.have.property("id");
        });

        test("response contains filename", function () {
          const body = res.getBody();
          expect(body).to.have.property("filename");
        });

        test("response contains contentType", function () {
          const body = res.getBody();
          expect(body).to.have.property("contentType");
        });

        test("response contains sizeBytes", function () {
          const body = res.getBody();
          expect(body).to.have.property("sizeBytes");
        });

        test("response contains uploadedAt", function () {
          const body = res.getBody();
          expect(body).to.have.property("uploadedAt");
        });

        test("filename was updated", function () {
          const body = res.getBody();
          expect(body.filename).to.equal("HelloWorld-renamed.pdf");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
