<app-navbar />
<main class="share-page">
  <div class="share-page__inner">
    <header class="share-page__intro">
      <div>
        <p class="share-page__eyebrow">DOKUMENTENBIBLIOTHEK</p>
        <h1>Dokument öffnen</h1>
        <p class="share-page__subtitle">Gib den Code und das Passwort ein, um ein geteiltes Dokument aufzurufen.</p>
      </div>
    </header>

    <section class="share-panel" aria-labelledby="share-heading">
      <div class="panel-heading">
        <div>
          <h2 id="share-heading">Geteiltes Dokument öffnen</h2>
          <p>Gib die Zugangsdaten für das Dokument ein.</p>
        </div>
      </div>

      <div class="share-fields">
        <div class="share-field">
          <label for="share-code">Code</label>
          <input id="share-code" name="code" type="text" autocomplete="off" placeholder="Dokument-Code">
        </div>
        <div class="share-field">
          <label for="share-password">Passwort</label>
          <input id="share-password" name="password" type="password" autocomplete="off" placeholder="Passwort">
        </div>
      </div>
    </section>
  </div>
</main>
