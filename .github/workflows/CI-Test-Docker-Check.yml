name: CI Test & Docker Smoke Check

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

env:
  DB_NAME: capadoc_db
  DB_USER: capadoc_user
  DB_PASSWORD: capadoc_ci_password

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: CapaDocAPI/pom.xml

      - name: Maven-Tests ausführen
        working-directory: CapaDocAPI
        run: ./mvnw --batch-mode clean test

      - name: Docker Compose bauen und starten
        working-directory: CapaDocAPI
        run: docker compose up --build -d

      - name: Backend-Erreichbarkeit prüfen
        working-directory: CapaDocAPI
        run: |
          echo "Warte auf das Backend..."
          timeout 90s bash -c '
            until curl --fail --silent http://localhost:8081/api/ping > /dev/null; do
              sleep 3
            done
          '
          echo "Backend läuft und antwortet."

      - name: Compose-Logs bei Fehlern
        if: failure()
        working-directory: CapaDocAPI
        run: docker compose logs --no-color

      - name: Aufräumen
        if: always()
        working-directory: CapaDocAPI
        run: docker compose down -v
