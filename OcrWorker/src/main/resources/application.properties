spring.application.name=OcrWorker

# RabbitMQ-Verbindung
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:capadoc}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:capadoc}
spring.rabbitmq.connection-timeout=5000

# RabbitMQ-Ressourcen (OCR-Queue)
capadoc.rabbitmq.exchange=ocr.exchange
capadoc.rabbitmq.queue=ocr.queue
capadoc.rabbitmq.routingkey=ocr.routingkey

# Dead-Letter-Konfiguration (OCR-DLQ)
capadoc.rabbitmq.dlx=ocr.dlx
capadoc.rabbitmq.dlq=ocr.dlq
capadoc.rabbitmq.dlq.routingkey=ocr.dlq.routingkey

# Indexing-Queue (Ausgangs-Queue für erkannten Text)
capadoc.rabbitmq.indexing.exchange=indexing.exchange
capadoc.rabbitmq.indexing.queue=indexing.queue
capadoc.rabbitmq.indexing.routingkey=indexing.routingkey

# Status-Queue (Ausgangs-Queue für Status-Events an den REST-Server)
capadoc.rabbitmq.status.exchange=document.status.exchange
capadoc.rabbitmq.status.queue=document.status
capadoc.rabbitmq.status.routingkey=document.status.routingkey
capadoc.rabbitmq.status.dlx=document.status.dlx
capadoc.rabbitmq.status.dlq=document.status.dlq
capadoc.rabbitmq.status.dlq.routingkey=document.status.dlq.routingkey

# Bei Listener-Fehlern nicht automatisch endlos requeue'n
spring.rabbitmq.listener.simple.default-requeue-rejected=false
