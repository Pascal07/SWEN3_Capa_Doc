spring.application.name=OcrWorker

capadoc.rabbitmq.exchange=test.ocr.exchange
capadoc.rabbitmq.queue=test.ocr.queue
capadoc.rabbitmq.routingkey=test.ocr.routingkey
capadoc.rabbitmq.dlx=test.ocr.dlx
capadoc.rabbitmq.dlq=test.ocr.dlq
capadoc.rabbitmq.dlq.routingkey=test.ocr.dlq.routingkey
capadoc.rabbitmq.indexing.exchange=test.indexing.exchange
capadoc.rabbitmq.indexing.queue=test.indexing.queue
capadoc.rabbitmq.indexing.routingkey=test.indexing.routingkey
capadoc.rabbitmq.status.exchange=test.document.status.exchange
capadoc.rabbitmq.status.queue=test.document.status
capadoc.rabbitmq.status.routingkey=test.document.status.routingkey
capadoc.rabbitmq.status.dlx=test.document.status.dlx
capadoc.rabbitmq.status.dlq=test.document.status.dlq
capadoc.rabbitmq.status.dlq.routingkey=test.document.status.dlq.routingkey

spring.rabbitmq.listener.simple.auto-startup=false

storage.rustfs.endpoint=http://localhost:9000
storage.rustfs.access-key=test-access-key
storage.rustfs.secret-key=test-secret-key
storage.rustfs.bucket=documents
storage.rustfs.region=us-east-1

ocr.languages=deu+eng
ocr.dpi=300
ocr.timeout-per-page=10s
ocr.tesseract-command=tesseract
ocr.ghostscript-command=gs
ocr.max-retries=3
ocr.retry-backoff-ms=5
