spring.application.name=IndexWorker

spring.datasource.url=jdbc:h2:mem:indexworker_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

capadoc.rabbitmq.indexing.exchange=test.indexing.exchange
capadoc.rabbitmq.indexing.queue=test.indexing.queue
capadoc.rabbitmq.indexing.routingkey=test.indexing.routingkey
capadoc.rabbitmq.indexing.dlx=test.indexing.dlx
capadoc.rabbitmq.indexing.dlq=test.indexing.dlq
capadoc.rabbitmq.indexing.dlq.routingkey=test.indexing.dlq.routingkey

spring.rabbitmq.listener.simple.auto-startup=false

elasticsearch.url=http://localhost:9200
elasticsearch.index-name=documents
elasticsearch.auto-create-index=false
elasticsearch.indexing-max-retries=3
elasticsearch.indexing-retry-backoff-ms=5
