spring.application.name=IndexWorker

# PostgreSQL-Verbindung (für indexStatus-Updates)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:capadoc_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:capadoc_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# RabbitMQ-Verbindung
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:capadoc}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:capadoc}
spring.rabbitmq.connection-timeout=5000

# Indexing-Queue (Eingangs-Queue vom OCR-Worker und Lösch-Events vom REST-Server)
capadoc.rabbitmq.indexing.exchange=indexing.exchange
capadoc.rabbitmq.indexing.queue=indexing.queue
capadoc.rabbitmq.indexing.routingkey=indexing.routingkey

# Dead-Letter-Konfiguration (Indexing-DLQ)
capadoc.rabbitmq.indexing.dlx=indexing.dlx
capadoc.rabbitmq.indexing.dlq=indexing.dlq
capadoc.rabbitmq.indexing.dlq.routingkey=indexing.dlq.routingkey

# Bei Listener-Fehlern nicht automatisch endlos requeue'n
spring.rabbitmq.listener.simple.default-requeue-rejected=false
